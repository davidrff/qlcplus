name: QLC+ 4.14.4 Cross-platform CI

on: ["push", "pull_request"]

jobs:
  linux-v4:
    runs-on: ubuntu-22.04
    name: QLC+ 4.14.4 Linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libusb-1.0-0-dev libftdi1-dev shared-mime-info \
            libudev-dev libmad0-dev libsndfile1-dev liblo-dev libfftw3-dev \
            libgl1-mesa-dev libxml2-utils xvfb

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          dir: '${{ github.workspace }}/qt/'
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/Qt/6.10.2/gcc_64/lib/cmake"

      - name: Build
        shell: bash
        run: cmake --build build --parallel 4

      - name: Unit tests
        shell: bash
        run: cmake --build build --target check

  windows-v4:
    runs-on: windows-latest
    name: QLC+ 4.14.4 Windows
    env:
      QT_VERSION: '6.10.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          dir: '${{ github.workspace }}/qt/'
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'
          cache: true

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: true
          update: false
          path-type: inherit
          install: >-
            wget
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-python-lxml

      - name: Install D2XX SDK
        shell: msys2 {0}
        run: |
          mkdir -p /c/projects/D2XXSDK
          wget https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip -O /c/projects/D2XXSDK/cdm.zip
          cd /c/projects/D2XXSDK
          unzip -o cdm.zip
          cd amd64
          gendef.exe - ftd2xx64.dll > ftd2xx.def
          dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a

      - name: Apply Windows compatibility adjustments
        shell: msys2 {0}
        run: |
          sed -i -e 's/Debug/Release/g' CMakeLists.txt
          sed -i -e 's/    add_subdirectory(velleman)/#    add_subdirectory(velleman)/g' plugins/CMakeLists.txt
          sed -i -e 's/$ENV{SystemDrive}\/msys64/D:\/a\/_temp\/msys64/g' platforms/windows/CMakeLists.txt

      - name: Configure
        shell: msys2 {0}
        run: |
          QTDIR="/d/a/qlcplus/qlcplus/qt/Qt/${QT_VERSION}/mingw_64"
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${QTDIR}/lib/cmake"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 4

  macos-v4:
    runs-on: macos-15
    name: QLC+ 4.14.4 macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system dependencies
        shell: bash
        run: |
          brew install fftw mad libsndfile libftdi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          dir: '${{ github.workspace }}/qt/'
          target: desktop
          arch: clang_64
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/Qt/6.10.2/macos/lib/cmake" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        shell: bash
        run: cmake --build build --parallel 3

      - name: Install
        shell: bash
        run: cmake --build build --target install
